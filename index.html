const map=L.map('map',{zoomControl:true,preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap contributors, Tiles style by OSM France'}).addTo(map);

const limeLayer=L.layerGroup().addTo(map);
const highLayer=L.layerGroup().addTo(map);
const middleLayer=L.layerGroup().addTo(map);
const elementaryLayer=L.layerGroup().addTo(map);

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

stores.forEach(s=>{
  const m=L.circleMarker([s.lat,s.lon],{radius:9,fillColor:'#B7FF32',color:'#111',weight:2,fillOpacity:1}).addTo(limeLayer);
  m.bindTooltip(esc(s.name),{direction:'top',offset:[0,-5]});
  m.bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.address)}`);
});

schools.forEach(s=>{
  let layer,style;
  if(s.level==='High'){layer=highLayer;style={radius:6,fillColor:'#111',color:'#fff',weight:1.5,fillOpacity:1};}
  else if(s.level==='Middle'){layer=middleLayer;style={radius:6,fillColor:'#808080',color:'#fff',weight:1.5,fillOpacity:1};}
  else {layer=elementaryLayer;style={radius:6,fillColor:'#fff',color:'#111',weight:1.5,fillOpacity:1};}
  const m=L.circleMarker([s.lat,s.lon],style).addTo(layer);
  m.bindTooltip(esc(s.name),{direction:'top',offset:[0,-4]});
  const hits=(s.hits||[]).sort((a,b)=>a.distance-b.distance).map(h=>`${esc(h.name)} — ${h.distance.toFixed(2)} mi`).join('<br>');
  const enr=s.enrollment==null?'Not listed':Number(s.enrollment).toLocaleString();
  m.bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.level)} School<br>${esc(s.address)}<br><b>Enrollment:</b> ${enr}<br><b>Nearby LIME location(s):</b><br>${hits}`);
});

L.control.layers(null,{
  'LIME Locations':limeLayer,
  'High Schools':highLayer,
  'Middle Schools':middleLayer,
  'Elementary Schools':elementaryLayer
},{collapsed:false}).addTo(map);

const pts=[];
stores.forEach(s=>pts.push([s.lat,s.lon]));
schools.forEach(s=>pts.push([s.lat,s.lon]));
map.fitBounds(pts,{padding:[35,35]});
</script>
